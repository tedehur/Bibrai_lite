<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 350px; font-family: Arial, sans-serif; padding: 10px; background-color: #1e1e1e; color: #fff; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; background-color: #2d2d2d; color: #fff; border: 1px solid #444; padding: 5px; box-sizing: border-box; font-family: monospace; }
        button { width: 100%; padding: 10px; margin-bottom: 10px; background-color: #0078D7; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background-color: #005a9e; }
        h2 { font-size: 16px; text-align: center; margin-top: 0; }
        .result-box { background-color: #000; padding: 10px; border: 1px solid #444; min-height: 40px; word-wrap: break-word; font-family: monospace; color: #00ff00; }
    </style>
</head>
<body>
    <h2>🌐 BIBRAI Converter</h2>
    
    <textarea id="inputText" placeholder="Tapez votre texte ici..."></textarea>
    
    <button id="btnEncode">⬇️ Encoder en BIBRAI</button>
    <button id="btnDecode">⬆️ Décoder depuis BIBRAI</button>
    
    <div style="margin-top: 10px;">Résultat :</div>
    <div id="outputResult" class="result-box"></div>

    <script src="popup.js"></script>
</body>
</html>
